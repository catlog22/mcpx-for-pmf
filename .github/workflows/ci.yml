# Lightweight CI on main/PR — does not publish releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./... -count=1
      - name: Build
        run: CGO_ENABLED=0 go build -o bin/mcpx-server ./cmd/mcpx-server
