# Public tool short descriptions (list surface). Schema structure stays in Go.
tools:
  workspace: 列出当前已注册的 Workspace；action=list。该工具不需要 Remote Session，用于在创建 session 前发现可用工作空间。
  read: 读取 Workspace 文件、搜索结果、文件列表、上下文或环境；view 决定读取语义，支持 items[] 批量读取。view=list 同时返回递归普通文件 files 和当前 scope 第一层 entries（file/directory/symlink/other）；清理 Workspace 前优先读取根 entries，entries_complete=false 或 entries_policy_filtered=true 时不得声称范围完整。purpose 应简短说明读取对象与用途，并明确这是只读检查、不修改 Workspace。
  edit: 使用精确片段或完整内容批量修改 Workspace 文件；不提供文件删除。用户提出删除、移除或清理时必须先使用 move_out(action=prepare)，用户确认后再使用 move_out(action=submit)；返回内联 Unified Diff 与严格变更行统计。purpose 应说明具体文件和变更目的；用户已明确要求时应真实声明按用户要求/已授权，禁止虚构授权。
  move_out: 安全移出已注册 Workspace 内明确文件、目录或 symlink；action=prepare 严格只读并冻结 manifest，返回 confirmation_uuid 与下一动作；action=submit 只接受 remote_session_id 和该 confirmation_uuid，并重新校验服务端冻结的 manifest、purpose、idempotency_key 与 Workspace 后移至操作系统回收站。directory 的 prepare 只校验根路径，不扫描、哈希或返回子树；symlink 只移动链接入口且绝不跟随目标。purpose 必须真实区分仅 prepare 预览和用户已授权移出明确目标；submit 只使用已确认 confirmation_uuid。
  observe: 查看会话状态、历史、最近文件变更、任务日志或工作区差异；view=history 支持按事件、请求、Operation、Task、Edit、关键词、类型、状态和时间过滤，并用 cursor 分页。
  progress: 向用户公开汇报模型工作的语义状态；里程碑可用 in_progress，本轮使用过 MCPX 后停止工具调用前必须以 completed、waiting_for_user、blocked 或 failed 汇报终态。result 只能写已验证结果，next 写下一步。
  session: 创建、直接接入或关闭 Remote Session；action 决定生命周期。
  execute: 按策略执行命令或项目任务，并统一处理 Task attach/stop/stdin；支持 `&&`、`||`、`;` 组合简单命令，启动 shell 前会拆分全部 segment 逐段策略判定并写 preflight audit，任一 deny 则整条拒绝；短命令内联返回，超过 yield_time_ms 才返回 Task ID；execution_mode=async 只表示 Operation 异步调度。purpose 必须描述真实命令意图和影响边界，并按副作用而非语言分类：版本/帮助/纯检查只有确实无写入时才声明只读；编译/构建说明缓存和产物范围；pytest、npm test、cargo test、mvn/gradle test、dotnet test 等项目测试会执行项目代码；依赖安装说明依赖目录、环境、锁文件或缓存写入；发布、推送、部署、安装、删除仅在用户已明确要求或确认时声明授权并限定目标，禁止虚构安全或授权。
  plan: 创建、读取、推进、阻塞、重规划或交付持久化计划；action 决定具体动作。
  operation_batch: 提交多个公开工具操作；无依赖步骤并发，有依赖按 DAG。
  operation_manage: 查询、等待、读取结果、取消或恢复异步操作。
  runtime_read: 读取能力、项目摘要或适用指令；view 决定内容。
  environment_read: 读取当前运行环境或与快照比较；view=current|compare。
  environment: 保存环境快照；action=snapshot_create。
  discover: 显式发现或描述 Skill 与上游 MCP；kind 与 view 决定对象，并签发 discovery_id/revision。
  skill_call: 调用已由 discover 返回的 Skill；名称、schema 和 revision 必须匹配。
  mcp_call: 调用已由 discover 返回的上游 MCP 工具；不得隐式发现。
  artifact: 登记、列出或分片读取 MCPX 开发产物；action 决定具体动作。
  screenshot_capture: 截取显示器或屏幕区域。
  secret_provide: 提供仅驻留内存的 Secret，不写入结果或日志。
