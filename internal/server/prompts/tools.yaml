# Public tool descriptions. Input schemas are authoritative for arguments.
tools:
  workspace: 零参数列出已注册 Workspace；用于创建 session 前发现工作空间。
  session: 创建、恢复或关闭 Remote Session；省略 action 默认 open/resume，remote_session_id 存在时恢复原会话，mode 可直接推导 close。
  read: 读取、搜索、列举或组装 Workspace 源码上下文；view 在语义唯一时可省略，items[] 支持批量文件读取。环境事实使用 environment_read。
  edit: 创建、更新或重命名 Workspace 文件；使用 revision guard 和幂等语义，不提供删除。删除/移出使用 move_out。
  move_out: 安全移出明确文件、目录或 symlink；prepare 冻结 manifest，用户确认后 submit 仅携带服务端 confirmation_uuid。
  observe: 查看会话、执行 Task、Plan Task、历史或日志；目标唯一时可省略 view，任务日志支持流式 offset 续读。
  progress: 发布用户可见进度与终态；过程仅用于有业务意义的里程碑、等待、阻塞或失败，任务正常完成并准备最终回复前必须用 completed + result 汇报一次最终结果。
  execute: 按策略执行命令或项目任务并处理 attach/stop/stdin；purpose 必须描述真实目标和副作用，长命令返回 execution_task_id。
  plan: 创建、读取、推进、阻塞、重规划或交付持久化计划。
  pi_execute: 将任务委派给本地 Pi Agent 执行（默认 companion 式直接执行），支持 system 提示注入；关联 plan 任务时自动推进状态并记录 execute 证据，长任务返回 execution_task_id 供 execute attach/stop。
  pi_window: 发现并消息投递到已运行的 Pi 窗口（workspace-peer 文件协议，同 teammate-send 通道）；send 前必须先 list，且始终要求用户语义确认。
  task_delegate: 委派任务到 Pi 窗口并注入结果回传指令；入参与 pi_window send 一致，message 末尾会自动追加结果写入指引，返回 task_id 与 result_path，后续用 task_result_view 查询。
  task_spawn: 在指定 workspace 启动 detached 新 pi 进程跑任务；message 末尾自动注入结果回传指令（完成后用 write 工具写入结果文件并退出）；返回 task_id/result_path/pid/log_path，结果用 task_result_view 查询。
  task_result_view: 查询委派任务的状态与结果；delegated_task_id 查询单个任务，省略时列出 remote_session_id 的全部委派任务，已结算的结果文件合并为 status/result/result_summary。
  operation_batch: 按 DAG 提交多个公开工具操作；无依赖步骤可并发。
  operation_manage: 查询、等待、读取结果、取消或恢复异步 Operation。
  runtime_read: 读取 MCPX 运行时能力、项目摘要或适用指令。
  environment_read: 读取当前主机/工具链环境或与已保存快照比较。
  environment: 保存当前环境快照。
  skill_tool: 统一完成 Skill 的 list、describe 与 call；Runtime 内部负责 revision 一致性。
  mcp_tool: 统一完成 MCP Server/Tool 的 list、describe 与 call；Runtime 内部负责 schema revision 一致性。
  artifact: 登记、列出或分片读取 MCPX 开发产物。
  screenshot_capture: 按明确 purpose 截取显示器或屏幕区域。
  secret_provide: 按明确 purpose 向当前会话提供仅驻留内存的 Secret。
